[package]
name = "trackball"
version = "0.18.0"
rust-version = "1.89.0"
edition = "2024"
authors = ["Rouven Spreckels <rs@qu1x.dev>"]
description = "Virtual Trackball Orbiting via the Exponential Map"
documentation = "https://docs.rs/trackball"
repository = "https://github.com/qu1x/trackball"
build = "build.rs"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = [
	"virtual-trackball",
	"exponential-map",
	"quaternion",
	"arcball",
	"camera",
]
categories = [
	"no-std",
	"graphics",
]
include = [
	"src/**/*.rs",
	"c11/src/**/*.[hc]",
	"build.rs",
	"Cargo.toml",
	"README.md",
	"RELEASES.md",
	"LICENSES/*",
]

[package.metadata.docs.rs]
features = ["serde", "rkyv"]
cargo-args = ["-Z", "unstable-options", "-Z", "rustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
heapless = { version = "0.9.3", default-features = false }
glam = { version = "0.33.12", default-features = false, features = ["libm", "approx"] }
approx = { version = "0.5.1", default-features = false }
num-traits = { version = "0.2.19", default-features = false, features = ["libm"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"], optional = true }
rkyv = { version = "0.8.10", default-features = false, optional = true }

[features]
serde = ["dep:serde", "glam/serde"]
rkyv = ["dep:rkyv", "glam/rkyv"]

[build-dependencies]
cc = { version = "1.2.65", optional = true }

[lints.rust]
missing-docs = "deny"

[lints.rustdoc]
broken-intra-doc-links = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
tabs-in-doc-comments = "allow"
similar_names = "allow"
