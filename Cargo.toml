[package]
name = "trackball"
version = "0.19.0"
rust-version = "1.89.0"
edition = "2024"
authors = ["Rouven Spreckels <rs@qu1x.dev>"]
description = "Virtual Trackball Orbiting via the Exponential Map"
documentation = "https://docs.rs/trackball"
repository = "https://github.com/qu1x/trackball"
build = "build.rs"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = [
	"virtual-trackball",
	"exponential-map",
	"quaternion",
	"arcball",
	"camera",
]
categories = [
	"no-std",
	"graphics",
]
include = [
	"src/**/*.rs",
	"c11/src/**/*.[hc]",
	"build.rs",
	"Cargo.toml",
	"README.md",
	"RELEASES.md",
	"LICENSE-*",
]

[package.metadata.docs.rs]
features = ["serde", "rkyv-08"]
cargo-args = ["-Z", "unstable-options", "-Z", "rustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
glam = { version = "0.33.12", default-features = false }
libm = { version = "0.2.16", optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive"], optional = true }
rkyv-08 = { package = "rkyv", version = "0.8.10", default-features = false, optional = true }

[features]
default = ["std"]
std = ["glam/std"]
libm = ["dep:libm", "glam/libm"]
nostd-libm = ["dep:libm", "glam/nostd-libm"]
serde = ["dep:serde", "glam/serde"]
rkyv-08 = ["dep:rkyv-08", "glam/rkyv-08"]

[build-dependencies]
cc = { version = "1.2.65", optional = true }

[lints.rust]
missing-docs = "deny"

[lints.rustdoc]
broken-intra-doc-links = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
tabs-in-doc-comments = "allow"
similar_names = "allow"
